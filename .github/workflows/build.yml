name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Prepare app icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          tr -d '\r\n ' < icon/ic_launcher_foreground.txt | base64 -d > app/src/main/res/drawable-nodpi/ic_launcher_foreground.webp

      - name: Prepare signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_B64: ${{ secrets.OMNILAND_KEYSTORE_B64 }}
        run: |
          echo "$KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.OMNILAND_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.OMNILAND_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.OMNILAND_KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cp app/build/outputs/apk/release/app-release*.apk "OmniNote-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: OmniNote
          path: OmniNote-v*.apk

      - name: Attach APK to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" OmniNote-v*.apk --clobber
